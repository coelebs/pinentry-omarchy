name: shellcheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest.json
        run: jq -e . manifest.json >/dev/null
      - name: Shellcheck
        run: |
          shellcheck --severity=warning bin/pinentry-omarchy
          shellcheck --severity=warning bin/pinentry-omarchy-reply
